name: Build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "external/**"
      - "dist/**"
      - "licencias/**"
      - "cmake/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "android/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  LLVM_MINGW_VERSION: "20251104"
  NESTOPIA_COMMIT: 39e4b456cea6f5e962ce3e65bcdcd7313711a905

jobs:
  windows:
    name: Windows x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build zip nasm

      # Los 8 núcleos tardan mucho en compilar y casi nunca cambian: se guardan en caché. La clave
      # cambia sola si se toca un script de núcleo (otra versión) o la versión de llvm-mingw.
      - name: Caché de los núcleos
        id: cache-cores
        uses: actions/cache@v4
        with:
          path: build/cores
          key: cores-${{ env.LLVM_MINGW_VERSION }}-${{ hashFiles('scripts/build-core-*.sh', 'cmake/llvm-mingw.cmake') }}

      - name: Caché de llvm-mingw
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: ~/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}

      - name: Descargar llvm-mingw
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          tar xf /tmp/llvm-mingw.tar.xz -C ~
          mv ~/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64 ~/llvm-mingw

      - name: Núcleo de NES (Nestopia UE)
        if: steps.cache-cores.outputs.cache-hit != 'true'
        env:
          LLVM_MINGW: /home/runner/llvm-mingw
        run: scripts/build-core-nestopia.sh build/cores

      - name: Núcleo de Game Boy y Game Boy Advance (mGBA)
        if: steps.cache-cores.outputs.cache-hit != 'true'
        env:
          LLVM_MINGW: /home/runner/llvm-mingw
        run: scripts/build-core-mgba.sh build/cores

      - name: Núcleo de Genesis / Mega Drive (BlastEm)
        if: steps.cache-cores.outputs.cache-hit != 'true'
        env:
          LLVM_MINGW: /home/runner/llvm-mingw
        run: scripts/build-core-blastem.sh build/cores

      - name: Núcleo de SNES (bsnes)
        if: steps.cache-cores.outputs.cache-hit != 'true'
        env:
          LLVM_MINGW: /home/runner/llvm-mingw
        run: scripts/build-core-bsnes.sh build/cores

      - name: Núcleo de PlayStation (Beetle PSX HW)
        if: steps.cache-cores.outputs.cache-hit != 'true'
        env:
          LLVM_MINGW: /home/runner/llvm-mingw
        run: scripts/build-core-beetle-psx.sh build/cores

      - name: Núcleo de Nintendo 64 (Mupen64Plus-Next)
        if: steps.cache-cores.outputs.cache-hit != 'true'
        env:
          LLVM_MINGW: /home/runner/llvm-mingw
        run: scripts/build-core-mupen64plus.sh build/cores

      - name: Núcleo de Nintendo DS (melonDS DS)
        if: steps.cache-cores.outputs.cache-hit != 'true'
        env:
          LLVM_MINGW: /home/runner/llvm-mingw
        run: scripts/build-core-melonds.sh build/cores

      - name: Núcleo de Sega Saturn (Beetle Saturn)
        if: steps.cache-cores.outputs.cache-hit != 'true'
        env:
          LLVM_MINGW: /home/runner/llvm-mingw
        run: scripts/build-core-beetle-saturn.sh build/cores

      - name: Satronho Emulation
        env:
          LLVM_MINGW: /home/runner/llvm-mingw
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/llvm-mingw.cmake \
            -DSATRONHO_BUILD=${{ github.run_number }}
          cmake --build build -j"$(nproc)"
          ~/llvm-mingw/bin/x86_64-w64-mingw32-strip -s build/satronho-emulation.exe

      # Prueba automática: se compila también para Linux y se abre la app sin pantalla (modo de
      # revisión) en varias páginas. Si se cierra con error, no se publica nada.
      - name: Prueba de arranque (Linux)
        run: |
          # OpenGL por software (Mesa) para probar también el motor OpenGL; si no arranca, la app
          # cae sola al motor clásico, y eso también se prueba.
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libgles2 > /dev/null || true
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build build-linux -j"$(nproc)"
          touch build-linux/portable.txt
          for q in "fresh=1;frames=40" "page=ajustes;tab=3;frames=30" "page=ajustes;tab=6;frames=30" \
                   "page=controles;ctrl=1;frames=30" "page=sugerida;frames=30" "page=novedades;frames=30" "welcome=1;frames=30"; do
            echo "Revisión: $q"
            SDL_RENDER_DRIVER=software SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy SATRONHO_QA="$q" timeout 120 build-linux/satronho-emulation
          done
          for q in "page=guias;preguntar=como va el 64;frames=40" "page=ajustes;tab=8;frames=30" "page=ajustes;tab=0;frames=30" \
                   "vista=1;frames=30" "salir=1;frames=30" "novedades_ventana=1;frames=30"; do
            for motor in opengl software; do
              echo "Revisión ($motor): $q"
              SATRONHO_GFX=$motor SDL_RENDER_DRIVER=software SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy SATRONHO_QA="$q" timeout 120 build-linux/satronho-emulation
            done
          done
          grep -h "Motor gráfico" build-linux/user/satronho.log | tail -2 || true
          # Desplazamiento: cada pantalla se baja mucho y se mueve de lado, como con el dedo. Si la
          # página crece sin fin o se corre de lado, la app sale con código 2 y no se publica.
          mkdir -p /tmp/juegos-prueba
          for i in $(seq 1 40); do head -c 40976 /dev/zero > "/tmp/juegos-prueba/Juego de prueba $i.nes"; done
          for q in "page=biblioteca" "page=biblioteca;vista=1" "page=biblioteca;vista=1;sistema=octa" "page=biblioteca;vista=2;sistema=octa" \
                   "page=biblioteca;ventana=1000x460" "page=biblioteca;ventana=720x1560" "page=ajustes" "page=herramientas" \
                   "page=controles" "page=sugerida" "page=novedades" "page=guias" "page=acerca"; do
            echo "Desplazamiento: $q"
            rm -rf build-linux/user
            SDL_RENDER_DRIVER=software SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy \
              SATRONHO_QA="$q;carpeta=/tmp/juegos-prueba;fresh=1;desplazar=1;frames=90" timeout 120 build-linux/satronho-emulation
          done

      - name: Empaquetar
        id: pack
        run: |
          N=${{ github.run_number }}
          PKG=SatronhoEmulation
          mkdir -p "$PKG/cores"
          cp build/satronho-emulation.exe "$PKG/"
          cp -r build/assets "$PKG/assets"
          python3 scripts/release-notes.py "$N" "$PKG/assets/novedades.json"
          cp build/cores/*.dll "$PKG/cores/"
          cp -r licencias "$PKG/licencias"
          cp LICENSE "$PKG/licencias/SatronhoEmulation-GPL-3.0.txt"
          cp CREDITOS.md "$PKG/CREDITOS.md"
          ZIP="SatronhoEmulation-build-$N-windows-x64.zip"
          zip -qr9 "$ZIP" "$PKG"
          # Huella para que el actualizador compruebe que la descarga llegó completa.
          sha256sum "$ZIP" | cut -d' ' -f1 > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          ls -la "$ZIP"

      - name: Publicar Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          python3 scripts/release-notes.py "$N"
          gh release create "build-$N" "${{ steps.pack.outputs.zip }}" "${{ steps.pack.outputs.zip }}.sha256" \
            --target "${{ github.sha }}" \
            --title "Satronho Emulation · build $N" \
            --notes-file release-notes.md

  # La versión de Android sale en el mismo Release (después de crearlo la de Windows).
  android:
    needs: windows
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/android.yml
    with:
      tag: build-${{ github.run_number }}
      build: ${{ github.run_number }}
    secrets: inherit
